services:
  - type: web
    name: real-estate-rag-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGODB_URL_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_test_Y29oZXJlbnQtZWVsLTk2MzguY2xlcmsuYWNjb3VudHMuZGV2JA
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        value: https://coherent-eel-9638.clerk.accounts.dev
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: real-estate-rag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: VITE_API_BASE_URL
        value: https://real-estate-rag-backend.onrender.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: pk_test_Y29oZXJlbnQtZWVsLTk2MzguY2xlcmsuYWNjb3VudHMuZGV2JA
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


